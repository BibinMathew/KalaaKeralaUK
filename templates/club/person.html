<article class="person">{% if person.image %}<img src="{{ person.image.url }}" loading="lazy" alt="{{ person.name }}">{% else %}<div class="portrait-placeholder" aria-hidden="true">{{ person.name|first }}</div>{% endif %}<h3>{{ person.name }}</h3><span>{{ person.role }}</span>{% if person.term %}<small>{{ person.term }}</small>{% endif %}{% if person.bio %}<p>{{ person.bio }}</p>{% endif %}</article>
