<a class="card album-card" href="{% url 'album' album.slug %}">{% if album.image %}<img src="{{ album.image.url }}" alt="{{ album.title }}" loading="lazy">{% elif album.photos.first.image %}<img src="{{ album.photos.first.image.url }}" alt="{{ album.title }}" loading="lazy">{% else %}<div class="card-art"><span>▧</span></div>{% endif %}<div class="card-body"><span class="eyebrow">{{ album.date|date:'F Y' }} · {{ album.photos.count }} photos</span><h3>{{ album.title }}</h3><p>View album ↗</p></div></a>
