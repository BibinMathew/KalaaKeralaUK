<article class="card">{% if resource.image %}<img src="{{ resource.image.url }}" loading="lazy" alt="{{ resource.title }}">{% endif %}<div class="card-body"><h3>{{ resource.title }}</h3><div class="prose">{{ resource.body|linebreaks }}</div>{% if resource.url %}<a class="text-link" href="{{ resource.url }}" target="_blank" rel="noopener noreferrer">Find out more ↗</a>{% endif %}</div></article>
